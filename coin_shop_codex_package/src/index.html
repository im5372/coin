<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우리 반 동전 가게</title>
<style>
:root{--ink:#2f271e;--cream:#fff8ea;--wood:#8b552c;--wood2:#b8753b;--green:#35b767;--blue:#4f9ff6;--pink:#ff7da4;--orange:#ff9b45;--gold:#ffd55b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#3e3026;font-family:Arial,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;color:var(--ink);overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(circle at 50% 10%,#8d725f 0,#46372d 55%,#2c231d 100%)}
button{font:inherit}
#phone{position:relative;width:min(440px,100vw - 16px);height:min(900px,calc(100vh - 16px));min-height:650px;background:#f9edcf;border:8px solid #2e241d;border-radius:38px;overflow:hidden;box-shadow:0 20px 70px #0008, inset 0 0 0 2px #6f5645}
.screen{position:absolute;inset:0;overflow:hidden}
.hidden{display:none!important}

/* 공통 상단 */
.topbar{height:70px;display:flex;align-items:center;gap:10px;padding:9px 12px;background:linear-gradient(#fff8e9,#f7dfae);border-bottom:3px solid #bd8247;position:relative;z-index:30}
.homeBtn{width:48px;height:48px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 0 #c9b38f;font-size:25px;font-weight:900;color:#6c4a2c;cursor:pointer}
.playerBadge{flex:1;min-width:0;border-radius:18px;padding:9px 12px;font-size:22px;font-weight:1000;color:white;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 -4px #0001}
.playerBadge.A{background:linear-gradient(135deg,#3a8de8,#65baff)}
.playerBadge.B{background:linear-gradient(135deg,#ef6c9c,#ff99ba)}
.playerBadge.C{background:linear-gradient(135deg,#30ae61,#70d692)}
.progress{background:#fff;padding:10px 12px;border-radius:15px;font-size:16px;font-weight:1000;box-shadow:0 3px 0 #c9b38f;white-space:nowrap}

/* 시작 화면 */
#homeScreen{background:linear-gradient(#fbdfaf 0 22%,#f7f1d7 22% 100%)}
.awning{height:82px;background:repeating-linear-gradient(90deg,#ef7764 0 44px,#fff4de 44px 88px);border-bottom:6px solid #b96b3a;box-shadow:0 5px 12px #0002}
.homeShop{position:absolute;inset:82px 0 0;background:linear-gradient(#f8e4bd 0 63%,#c58749 63%);overflow:hidden}
.shelf{position:absolute;left:0;right:0;height:82px;background:linear-gradient(#c58a51,#9c6336);border-top:9px solid #784721;border-bottom:7px solid #6c3f20;box-shadow:inset 0 18px #ffffff12}
.shelf.one{top:72px}.shelf.two{top:180px}
.jars{position:absolute;top:84px;left:18px;right:18px;display:flex;justify-content:space-around;font-size:37px;opacity:.75}
.jars2{top:191px}
.titleBoard{position:relative;margin:-28px auto 12px;width:88%;padding:16px 10px;border-radius:22px;background:linear-gradient(#8d552b,#6c3d1d);border:5px solid #c98a49;box-shadow:0 8px 16px #0004;text-align:center;color:white;font-size:35px;font-weight:1000;letter-spacing:-2px}
.titleBoard b{color:#ffda55} .titleBoard em{font-style:normal;color:#84e099}
.homePrompt{position:relative;width:82%;margin:0 auto 14px;background:white;border-radius:18px;padding:10px 12px;text-align:center;font-size:18px;font-weight:900;box-shadow:0 4px 9px #0002}
.studentList{position:relative;width:86%;margin:auto;display:grid;gap:12px}
.studentBtn{border:4px solid white;border-radius:24px;min-height:100px;padding:8px 14px;display:grid;grid-template-columns:74px 1fr 42px;align-items:center;box-shadow:0 7px 0 #0002;cursor:pointer;color:#1f2a37}
.studentBtn:active{transform:translateY(4px);box-shadow:0 3px 0 #0002}
.studentBtn.A{background:linear-gradient(135deg,#ccecff,#73c4ff)}
.studentBtn.B{background:linear-gradient(135deg,#ffe0eb,#ff9fc1)}
.studentBtn.C{background:linear-gradient(135deg,#dbffe4,#87e5a6)}
.avatar{width:66px;height:66px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;border:3px solid #ffffff;box-shadow:0 3px 7px #0002}
.studentText{text-align:left;padding-left:10px} .studentName{font-size:31px;font-weight:1000;line-height:1} .studentLevel{font-size:15px;font-weight:900;margin-top:6px;opacity:.75}
.arrow{font-size:38px;font-weight:1000}

/* 게임 장면 */
#gameScreen{background:#f8e7c7}
.scene{position:absolute;inset:70px 0 0;background:linear-gradient(#f6dcae 0 60%,#b5723a 60% 100%);overflow:hidden}
.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ffffff10 1px,transparent 1px),linear-gradient(#ffffff0c 1px,transparent 1px);background-size:25px 25px;pointer-events:none}
.storeShelf{position:absolute;left:0;right:0;height:82px;background:linear-gradient(#b57a45,#8f582f);border-top:8px solid #6e4021;border-bottom:7px solid #6e4021}
.storeShelf.s1{top:58px}.storeShelf.s2{top:160px}
.storeGoods{position:absolute;top:67px;left:12px;right:12px;display:flex;justify-content:space-around;font-size:30px;opacity:.55}
.storeGoods.g2{top:169px}
.speech{position:absolute;z-index:13;left:16px;top:18px;width:235px;background:#fff;border:4px solid #e9c692;border-radius:23px;padding:12px 13px;font-size:17px;font-weight:900;line-height:1.35;box-shadow:0 6px 12px #0002;text-align:left}
.speech:after{content:"";position:absolute;right:-20px;bottom:20px;border-left:20px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent}
.speech .price{font-size:30px;color:#e84c2c;font-weight:1000}
.speech .small{font-size:14px;color:#7a634e}

.productStage{position:absolute;z-index:10;left:22px;top:190px;width:145px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.productItem{font-size:88px;line-height:1;filter:drop-shadow(0 6px 4px #0002);transition:.3s}
.productLabel{margin-top:6px;background:#fff3d6;border:3px solid #cb8c43;border-radius:14px;padding:6px 12px;font-size:18px;font-weight:1000;box-shadow:0 4px 7px #0002}
.productPrice{font-size:22px;color:#d94f2e}

.seller{position:absolute;z-index:11;right:-4px;top:104px;width:278px;height:458px;overflow:visible}
.seller img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;border-radius:22px;filter:drop-shadow(0 8px 6px #0003)}
.handZone{position:absolute;z-index:20;left:13px;bottom:16px;width:158px;height:117px;border:4px dashed rgba(255,255,255,.95);border-radius:50%;display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap;padding:12px 16px;background:rgba(255,213,91,.12);transition:.15s;touch-action:none}
.handZone.active{transform:scale(1.05);background:rgba(255,229,91,.38);box-shadow:0 0 0 7px #ffd44b66}
.handHint{font-size:13px;font-weight:1000;color:#7c4c1c;background:#fff9e8d9;border-radius:10px;padding:5px 7px}
.handCoins{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;width:100%;height:100%}
.totalBubble{position:absolute;right:10px;top:572px;z-index:15;background:white;border:3px solid #e0b779;border-radius:15px;padding:6px 10px;font-size:18px;font-weight:1000}

/* 하준 전달 영역 */
.receiveZone{position:absolute;z-index:8;right:13px;top:550px;width:140px;height:82px;border:3px dashed #6bb6e6;border-radius:20px;background:#ecf8ffdd;display:none;align-items:center;justify-content:center;flex-direction:column;font-size:15px;font-weight:1000;color:#3178a6}
.receiveZone.show{display:flex} .receiveHands{font-size:34px;line-height:1}
.productItem.fly{position:fixed;z-index:9999;animation:flyProduct 1.2s cubic-bezier(.2,.8,.2,1) forwards;pointer-events:none}
@keyframes flyProduct{0%{transform:translate(0,0) scale(1);opacity:1}60%{transform:translate(180px,270px) scale(1.15);opacity:1}100%{transform:translate(230px,360px) scale(.72);opacity:.15}}

/* 동전 서랍 */
.coinDrawer{position:absolute;z-index:25;left:10px;right:10px;bottom:12px;height:181px;border:6px solid #6d3e20;border-radius:24px;background:linear-gradient(#9d6133,#70431f);box-shadow:0 -5px 14px #0003,inset 0 0 0 3px #c68a52;padding:9px 10px}
.drawerTitle{color:#fff7df;font-size:15px;font-weight:1000;text-align:left;margin:0 0 6px 5px}
.coinRow{height:105px;display:flex;align-items:center;justify-content:center;gap:23px;background:#5e381c88;border-radius:18px;padding:8px}
.coinSource{display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
.coinLabel{color:#fff;font-weight:1000;font-size:14px;margin-top:3px}
.coin{position:relative;border-radius:50%;overflow:hidden;background:white;box-shadow:0 5px 8px #0004;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.coin.c100{width:74px;height:74px} .coin.c500{width:88px;height:88px}
.coin img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}
.miniCoin{position:relative;border-radius:50%;overflow:hidden;background:white;box-shadow:0 2px 3px #0003;touch-action:none;cursor:grab}
.miniCoin.c100{width:34px;height:34px} .miniCoin.c500{width:40px;height:40px}
.miniCoin img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.drawerButtons{display:flex;gap:8px;margin-top:8px}
.actionBtn{flex:1;border:0;border-radius:14px;padding:9px 6px;font-size:17px;font-weight:1000;color:#fff;box-shadow:0 4px 0 #0002;cursor:pointer}
.buyBtn{background:linear-gradient(#42ca72,#20a956)} .resetBtn{background:linear-gradient(#9e85f7,#755fe2)} .nextBtn{background:linear-gradient(#45c86d,#16a347)}
.actionBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0002}

/* 피드백 */
.feedback{position:absolute;z-index:45;left:18px;right:18px;bottom:198px;border-radius:18px;padding:10px 12px;font-size:17px;font-weight:1000;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.feedback.show{opacity:1;transform:none}
.feedback.ok{background:#e8fff0;border:3px solid #62cb83;color:#247548}
.feedback.warn{background:#fff4e5;border:3px solid #f4b05a;color:#9b5714}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.spark{position:absolute;font-size:28px;animation:fall 1.2s ease-out forwards}
@keyframes fall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(500px) rotate(260deg);opacity:0}}

/* 드래그 복제 */
.dragGhost{position:fixed;z-index:99999;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 10px 24px #0005;pointer-events:none}
.dragGhost.c100{width:74px;height:74px} .dragGhost.c500{width:88px;height:88px}
.dragGhost img{width:100%;height:100%;object-fit:contain;display:block}

/* 완료 화면 */
#doneScreen{background:linear-gradient(#fff4c8,#f2c781);display:flex;align-items:center;justify-content:center;padding:30px}
.doneCard{width:100%;background:white;border-radius:30px;padding:30px 18px;text-align:center;box-shadow:0 12px 30px #0003;border:5px solid #e5b66d}
.doneTrophy{font-size:90px} .doneTitle{font-size:34px;font-weight:1000;margin:5px 0} .doneText{font-size:19px;font-weight:800;color:#6c5845}
.doneButtons{display:grid;gap:10px;margin-top:20px} .doneButtons button{border:0;border-radius:18px;padding:14px;font-size:20px;font-weight:1000;cursor:pointer}

@media(max-height:760px){
  #phone{height:calc(100vh - 8px);min-height:620px}
  .scene{transform-origin:top center}
  .speech{top:10px;font-size:15px;width:215px}
  .productStage{top:172px}
  .seller{top:88px;width:255px;height:420px}
  .coinDrawer{height:166px}
  .coinRow{height:90px}
  .coin.c100{width:64px;height:64px} .coin.c500{width:76px;height:76px}
}
</style>
</head>
<body>
<div id="phone">
  <section id="homeScreen" class="screen"></section>
  <section id="gameScreen" class="screen hidden"></section>
  <section id="doneScreen" class="screen hidden"></section>
  <div id="confetti" class="confetti"></div>
</div>

const students={
 A:{name:'지오',level:'A 수준',icon:'👦',subtitle:'가격에 맞는 돈 만들기'},
 B:{name:'하리',level:'B 수준',icon:'👧',subtitle:'알맞은 금액 만들기'},
 C:{name:'하준',level:'C 수준',icon:'👦',subtitle:'동전 주고 물건 받기'}
};
const data={
 A:[
  {price:300,item:'🍎',name:'사과',face:'num',prompt:'사과는 300원이에요.'},
  {price:500,item:'🧸',name:'곰인형',face:'num',prompt:'곰인형은 500원이에요.'},
  {price:700,item:'🚂',name:'기차',face:'pic',prompt:'이번에는 그림면을 보고 700원을 만들어 보세요.'}
 ],
 B:[
  {price:200,item:'🍓',name:'딸기',face:'num',prompt:'딸기는 200원이에요.'},
  {price:600,item:'🚗',name:'자동차',face:'num',prompt:'자동차는 600원이에요.'},
  {price:800,item:'🍪',name:'과자',face:'num',prompt:'과자는 800원이에요.'}
 ],
 C:[
  {item:'🍎',name:'사과',face:'num'},
  {item:'🧸',name:'곰인형',face:'num'},
  {item:'🍌',name:'바나나',face:'num'}
 ]
};

let mode=null, idx=0, selected=[], seq=0, locked=false, drag=null;
const home=document.getElementById('homeScreen'), game=document.getElementById('gameScreen'), done=document.getElementById('doneScreen');

function coinSrc(value,face){
 if(value===100) return face==='pic'?IMG100_PIC:IMG100_NUM;
 return face==='pic'?IMG500_PIC:IMG500_NUM;
}
function coinHTML(value,face,mini=false,id=null){
 const cls=value===500?'c500':'c100';
 const attr=mini?`data-selected-id="${id}" data-origin="hand"`:`data-origin="source"`;
 return `<div class="${mini?'miniCoin':'coin'} ${cls}" data-value="${value}" ${attr}><img src="${coinSrc(value,face)}" alt="${value}원 동전"></div>`;
}
function total(){return selected.reduce((s,c)=>s+c.value,0)}

function renderHome(){
 mode=null;idx=0;selected=[];locked=false;
 home.classList.remove('hidden');game.classList.add('hidden');done.classList.add('hidden');
 home.innerHTML=`<div class="awning"></div><div class="homeShop">
   <div class="shelf one"></div><div class="shelf two"></div>
   <div class="jars">🍪 🧃 🍬 🧸</div><div class="jars jars2">🍓 🍎 🚗 🍌</div>
   <div class="titleBoard">🪙 동전으로 <em>물건을</em> <b>사요!</b></div>
   <div class="homePrompt">누가 가게에 갈까요?<br>친구를 선택해 주세요.</div>
   <div class="studentList">
     ${studentButton('A')}${studentButton('B')}${studentButton('C')}
   </div>
 </div>`;
}
function studentButton(m){const s=students[m];return `<button class="studentBtn ${m}" onclick="startGame('${m}')"><span class="avatar">${s.icon}</span><span class="studentText"><span class="studentName">${s.name}</span><div class="studentLevel">${s.level} · ${s.subtitle}</div></span><span class="arrow">›</span></button>`}
function startGame(m){mode=m;idx=0;selected=[];locked=false;renderGame()}
function goHome(){cleanupDrag();renderHome()}
function restart(){idx=0;selected=[];locked=false;renderGame()}
function nextQuestion(){idx++;selected=[];locked=false;if(idx>=3)renderDone();else renderGame()}

function renderGame(){
 cleanupDrag();locked=false;
 home.classList.add('hidden');done.classList.add('hidden');game.classList.remove('hidden');
 const s=students[mode],q=data[mode][idx];
 const face=(mode==='B'||mode==='C')?'num':q.face;
 const isC=mode==='C';
 const speech=isC?`<b>${q.name}</b>을 사고 싶나요?<br>동전 하나를 제 손에 주세요!`:`${q.prompt}<br><span class="small">알맞은 돈을 제 손에 올려주세요.</span>`;
 const productPrice=isC?'동전과 바꾸기':`${q.price}원`;
 const handContent=selected.length?`<div class="handCoins">${selected.map(c=>coinHTML(c.value,face,true,c.id)).join('')}</div>`:`<span class="handHint">여기에 동전 놓기</span>`;
 game.innerHTML=`
 <div class="topbar"><button class="homeBtn" onclick="goHome()">⌂</button><div class="playerBadge ${mode}">${s.icon} ${s.name} <small>(${s.level})</small></div><div class="progress">${idx+1} / 3</div></div>
 <div class="scene">
   <div class="storeShelf s1"></div><div class="storeShelf s2"></div>
   <div class="storeGoods">🍬 🧃 🍪 🧸 🥫</div><div class="storeGoods g2">🍎 🚗 🍓 🍌 🧃</div>
   <div class="speech" id="speech">${speech}</div>
   <div class="productStage"><div id="productItem" class="productItem">${q.item}</div><div class="productLabel">${q.name}<br><span class="productPrice">${productPrice}</span></div></div>
   <div class="seller"><img src="${SELLER}" alt="손바닥을 내민 가게 주인"><div id="handZone" class="handZone">${handContent}</div></div>
   ${isC?'<div id="receiveZone" class="receiveZone"><div class="receiveHands">🙌</div><div>하준이가 받는 곳</div></div>':`<div class="totalBubble">합계 ${total()}원</div>`}
   <div id="feedback" class="feedback"></div>
   <div id="coinBank" class="coinDrawer">
     <div class="drawerTitle">👇 동전을 손바닥으로 끌어다 놓아요. ${!isC?'손의 동전을 다시 여기로 옮기면 뺄 수 있어요.':''}</div>
     <div class="coinRow">
       <div class="coinSource">${coinHTML(100,face)}<div class="coinLabel">100원</div></div>
       ${isC?'':`<div class="coinSource">${coinHTML(500,face)}<div class="coinLabel">500원</div></div>`}
     </div>
     <div id="actions" class="drawerButtons">
       ${isC?'<button class="actionBtn resetBtn" onclick="restart()">↻ 처음부터</button>':`<button class="actionBtn resetBtn" onclick="clearCoins()">↻ 다시 넣기</button><button class="actionBtn buyBtn" onclick="checkPurchase()">✓ 물건 사기</button>`}
     </div>
   </div>
 </div>`;
 bindDrags(face);
}

function renderDone(){
 cleanupDrag();home.classList.add('hidden');game.classList.add('hidden');done.classList.remove('hidden');const s=students[mode];
 done.innerHTML=`<div class="doneCard"><div class="doneTrophy">🏆</div><div class="doneTitle">${s.name}, 성공!</div><div class="doneText">가게 미션 3개를 모두 해냈어요.</div><div class="doneButtons"><button style="background:#7fda9b" onclick="goHome()">다른 친구 선택하기</button><button style="background:#c9b5ff" onclick="restart()">다시 해보기</button></div></div>`;
}
function clearCoins(){if(locked)return;selected=[];renderGame()}

function showFeedback(text,type='warn'){const f=document.getElementById('feedback');if(!f)return;f.textContent=text;f.className=`feedback show ${type}`;setTimeout(()=>{if(f)f.classList.remove('show')},1800)}
function updateSpeech(text){const s=document.getElementById('speech');if(s)s.innerHTML=text}
function checkPurchase(){
 if(locked||mode==='C')return;const q=data[mode][idx],sum=total();
 if(sum===0) return showFeedback('동전을 가게 주인의 손에 올려 주세요.');
 if(sum<q.price) return showFeedback('돈이 조금 부족해요. 동전을 더 올려볼까요?');
 if(sum>q.price) return showFeedback('돈이 너무 많아요. 동전을 다시 빼볼까요?');
 purchaseSuccess();
}
function purchaseSuccess(){
 locked=true;cleanupDrag();chime();confetti();updateSpeech(`<b>잘했어요!</b><br>${total()}원을 정확히 주었어요.<br><span class="price">${data[mode][idx].name}</span>을 드릴게요!`);
 const product=document.getElementById('productItem');if(product){product.style.transform='scale(1.16) rotate(-5deg)';setTimeout(()=>product.style.transform='',500)}
 const actions=document.getElementById('actions');if(actions)actions.innerHTML=`<button class="actionBtn nextBtn" onclick="nextQuestion()">➜ ${idx===2?'미션 완료':'다음 문제'}</button>`;
 showFeedback('🎉 맞아요! 물건을 샀어요.','ok');
}
function cSuccess(){
 if(locked)return;locked=true;cleanupDrag();chime();const q=data[mode][idx];
 updateSpeech(`<b>고마워요!</b><br>동전을 받았어요.<br><span class="price">${q.name}</span>을 줄게요!`);
 const receive=document.getElementById('receiveZone');if(receive)receive.classList.add('show');
 const original=document.getElementById('productItem');
 if(original){
   const r=original.getBoundingClientRect();const clone=original.cloneNode(true);clone.className='productItem fly';clone.style.left=r.left+'px';clone.style.top=r.top+'px';clone.style.margin='0';document.body.appendChild(clone);original.style.opacity='.2';setTimeout(()=>clone.remove(),1300);
 }
 setTimeout(()=>{confetti();showFeedback(`🎉 ${q.name}을 받았어요!`,'ok');const actions=document.getElementById('actions');if(actions)actions.innerHTML=`<button class="actionBtn nextBtn" onclick="nextQuestion()">➜ ${idx===2?'미션 완료':'다음 물건'}</button>`;},1000);
}

/* Pointer 기반 드래그 */
function bindDrags(face){
 document.querySelectorAll('.coin[data-origin="source"]').forEach(el=>el.addEventListener('pointerdown',e=>beginDrag(e,Number(el.dataset.value),'source',null,face)));
 document.querySelectorAll('.miniCoin[data-origin="hand"]').forEach(el=>el.addEventListener('pointerdown',e=>beginDrag(e,Number(el.dataset.value),'hand',Number(el.dataset.selectedId),face)));
}
function beginDrag(e,value,origin,id,face){
 if(locked)return;e.preventDefault();const ghost=document.createElement('div');ghost.className='dragGhost '+(value===500?'c500':'c100');ghost.innerHTML=`<img src="${coinSrc(value,face)}">`;document.body.appendChild(ghost);
 drag={value,origin,id,face,ghost};moveGhost(e.clientX,e.clientY);document.body.style.touchAction='none';
 window.addEventListener('pointermove',onMove,{passive:false});window.addEventListener('pointerup',onEnd,{passive:false});window.addEventListener('pointercancel',cancelDrag,{passive:false});highlight(e.clientX,e.clientY);
}
function moveGhost(x,y){if(!drag)return;drag.ghost.style.left=x+'px';drag.ghost.style.top=y+'px'}
function onMove(e){if(!drag)return;e.preventDefault();moveGhost(e.clientX,e.clientY);highlight(e.clientX,e.clientY)}
function highlight(x,y){document.querySelectorAll('.handZone,.coinDrawer').forEach(z=>z.classList.remove('active'));const el=document.elementFromPoint(x,y);const zone=el&&el.closest?el.closest('.handZone,.coinDrawer'):null;if(zone)zone.classList.add('active')}
function onEnd(e){
 if(!drag)return;e.preventDefault();const el=document.elementFromPoint(e.clientX,e.clientY);const zone=el&&el.closest?el.closest('.handZone,.coinDrawer'):null;const d={...drag};cleanupDrag();if(!zone)return;
 if(d.origin==='source'&&zone.id==='handZone'){if(mode==='C'){cSuccess();return}selected.push({id:++seq,value:d.value});renderGame();return}
 if(d.origin==='hand'&&zone.id==='coinBank'){selected=selected.filter(c=>c.id!==d.id);renderGame();return}
}
function cancelDrag(){cleanupDrag()}
function cleanupDrag(){document.querySelectorAll('.handZone,.coinDrawer').forEach(z=>z.classList.remove('active'));if(drag&&drag.ghost)drag.ghost.remove();drag=null;document.body.style.touchAction='';window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onEnd);window.removeEventListener('pointercancel',cancelDrag)}

function chime(){try{const a=new(AudioContext||webkitAudioContext)();[523,659,784].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.setValueAtTime(.09,a.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.12+.22);o.start(a.currentTime+i*.12);o.stop(a.currentTime+i*.12+.23)})}catch(e){}}
function confetti(){const box=document.getElementById('confetti');box.innerHTML='';for(let i=0;i<22;i++){const s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','🎉'][i%3];s.style.left=(Math.random()*95)+'%';s.style.top=(Math.random()*12)+'%';s.style.animationDelay=(Math.random()*.25)+'s';box.appendChild(s)}setTimeout(()=>box.innerHTML='',1500)}

renderHome();
