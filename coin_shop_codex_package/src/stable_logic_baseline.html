<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>끌어다 놓는 동전 게임</title>
<style>
:root{
  --ink:#243047;--paper:#fff7e9;--yellow:#ffcf67;--green:#42b983;
  --shadow:#d9cbb5;--blue:#e5f4ff;--drop:#fff8d9;--dropBorder:#f1bb38;
  --silver1:#f8fafc;--silver2:#aeb8c2;--silver3:#e7edf1;--silver4:#8e99a4
}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);text-align:center}
header{background:var(--yellow);padding:14px;font-size:clamp(24px,4vw,42px);font-weight:900}
main{max-width:960px;margin:auto;padding:16px}
h2{font-size:clamp(24px,4vw,36px);margin:14px 0}
button{touch-action:manipulation;cursor:pointer;border:0;border-radius:20px;padding:16px 22px;font-size:clamp(18px,3vw,28px);font-weight:800;background:#fff;color:var(--ink)!important;box-shadow:0 4px 0 var(--shadow);margin:8px;min-height:66px}
button *{color:var(--ink)!important}
button small{font-size:.62em;font-weight:700}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.choice{background:var(--blue);min-width:220px}.panel{background:#fff;border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 6px 18px #e4d8c2;color:var(--ink)}
.muted{color:#53627a}.big{font-size:clamp(28px,5vw,46px);font-weight:900}.status{min-height:62px;font-size:clamp(22px,3vw,30px);font-weight:bold;color:#166b43}.footer{margin-top:20px}.buy{background:#b9efcf}.reset{background:#ffe5da}
.bar{height:15px;background:#e5e7eb;border-radius:12px;overflow:hidden}.fill{height:100%;background:var(--green);transition:width .2s}
.item{font-size:95px;margin:8px}.hint{font-size:clamp(18px,2.5vw,24px);font-weight:800;color:#5b6473;margin:8px 0}

/* 동전 보관함 */
.returnZone{border:4px dashed #9eb8ce;background:#eff8ff;border-radius:24px;padding:14px;margin:14px auto;max-width:760px;transition:.15s ease}
.returnZone.active{background:#d8efff;border-color:#4b93c6;transform:scale(1.012)}
.returnTitle{font-size:clamp(20px,2.7vw,27px);font-weight:900;color:#315d7d;margin:0 0 8px}
.coinTray{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin:10px 0 4px}
.coinSource{display:flex;flex-direction:column;align-items:center}
.dragLabel{font-size:17px;font-weight:800;margin-top:6px;color:#5b6473}

/* 사용자가 제공한 실제 동전 이미지를 활용한 동전 */
.coin{--size:116px;width:var(--size);height:var(--size);border-radius:50%;position:relative;display:block;overflow:hidden;
  border:3px solid #b8bfc8;background:#f8f8f8;box-shadow:0 7px 15px rgba(0,0,0,.16);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;z-index:2}
.coin.c500{--size:145px}.coin:active{cursor:grabbing;transform:scale(1.03)}
.coin img{width:100%;height:100%;object-fit:contain;display:block;position:absolute;inset:0;pointer-events:none}

/* 결제칸의 작은 동전도 직접 드래그 가능 */
.miniCoin{--size:58px;width:var(--size);height:var(--size);border-radius:50%;position:relative;display:block;overflow:hidden;
  border:3px solid #b8bfc8;background:#f8f8f8;box-shadow:0 3px 7px rgba(0,0,0,.12);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.miniCoin.c500{--size:76px}.miniCoin img{width:100%;height:100%;object-fit:contain;display:block;position:absolute;inset:0;pointer-events:none}

/* 드롭 영역 */
.dropZone{border:4px dashed var(--dropBorder);background:var(--drop);border-radius:24px;min-height:180px;padding:18px;margin:16px auto;max-width:720px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.15s ease;position:relative}
.dropZone.active{transform:scale(1.015);background:#fff0b8;border-color:#e99e00}.dropTitle{font-size:clamp(22px,3vw,30px);font-weight:900;margin-bottom:8px}.selectedCoins{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;min-height:80px}.emptyText{font-size:22px;color:#6e7785;font-weight:700}.itemDrop{min-height:245px}.itemDrop .item{font-size:110px}.dragGuide{font-size:clamp(20px,3vw,28px);font-weight:900;color:#a76300;margin:6px 0 12px}
.reverseNotice{display:inline-block;background:#eef1ff;border:2px solid #a6afe8;border-radius:16px;padding:8px 14px;font-size:clamp(17px,2.4vw,22px);font-weight:900;color:#4e5790;margin-bottom:8px}

/* 손가락을 따라 움직이는 복제 동전 */
.dragGhost{position:fixed;left:0;top:0;width:118px;height:118px;border-radius:50%;display:block;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);opacity:.97;box-shadow:0 10px 25px rgba(0,0,0,.25);border:3px solid #b8bfc8;background:#f8f8f8;overflow:hidden}
.dragGhost img{width:100%;height:100%;object-fit:contain;display:block;position:absolute;inset:0}.dragGhost.c500{width:128px;height:128px}

#confetti{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:10000}.spark{position:absolute;font-size:40px;animation:drop 1.2s ease-out forwards}@keyframes drop{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(75vh) rotate(250deg);opacity:0}}
@media(max-width:600px){.coin{--size:94px}.coin.c500{--size:118px}.dragGhost{width:100px;height:100px}.dragGhost.c500{width:108px;height:108px}.item{font-size:78px}.itemDrop .item{font-size:92px}.choice{width:88%;min-width:0}.dropZone{min-height:155px}.miniCoin{--size:52px}.miniCoin.c500{--size:67px}}
</style>
</head>

<main id="app"></main>
<div id="confetti"></div>

const names={A:'지오',B:'하리',C:'하준'};
const labels={A:'가격에 맞게 동전 넣기',B:'알맞은 동전 고르기',C:'동전 주고 물건 받기'};

const data={
  A:[
    {price:300,item:'🍎',name:'사과',prompt:'300원을 만들어 보세요!',side:'obverse'},
    {price:500,item:'🧸',name:'곰인형',prompt:'500원을 만들어 보세요!',side:'obverse'},
    {price:700,item:'🚂',name:'기차',prompt:'동전의 뒷면을 보고 700원을 만들어 보세요!',side:'reverse',reverseProblem:true}
  ],
  B:[
    {price:200,item:'🍓',name:'딸기',prompt:'200원짜리 딸기를 사 보세요!',side:'obverse'},
    {price:600,item:'🚗',name:'자동차',prompt:'600원짜리 자동차를 사 보세요!',side:'obverse'},
    {price:800,item:'🍪',name:'과자',prompt:'800원짜리 과자를 사 보세요!',side:'obverse'}
  ],
  C:[
    {item:'🍎',name:'사과'},
    {item:'🧸',name:'곰인형'},
    {item:'🍌',name:'바나나'}
  ]
};

function sound(){
  try{const a=new(window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.setValueAtTime(.12,a.currentTime+i*.13);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.13+.22);o.start(a.currentTime+i*.13);o.stop(a.currentTime+i*.13+.23)})}catch(e){}
}
function sparks(){const box=document.getElementById('confetti');box.innerHTML='';for(let i=0;i<18;i++){const s=document.createElement('span');s.className='spark';s.textContent=['⭐','🎉','✨'][i%3];s.style.left=Math.random()*95+'%';s.style.top=Math.random()*20+'%';s.style.animationDelay=Math.random()*.3+'s';box.appendChild(s)}setTimeout(()=>box.innerHTML='',1600)}
function start(m){cleanupDrag();mode=m;idx=0;selectedCoins=[];locked=false;render()}
function home(){cleanupDrag();mode='';idx=0;selectedCoins=[];locked=false;render()}
function next(){cleanupDrag();idx++;selectedCoins=[];locked=false;render()}
function resetCoins(){if(locked)return;selectedCoins=[];render()}
function total(){return selectedCoins.reduce((a,b)=>a+b.value,0)}

function checkPurchase(){
  if(locked||mode==='C')return;
  const q=data[mode][idx],sum=total(),status=document.getElementById('status');
  if(sum===0){status.textContent='동전을 결제칸에 넣어 주세요!';return}
  if(sum>q.price){status.textContent='💡 돈이 너무 많아요. 동전을 보관함으로 다시 옮겨 볼까요?';return}
  if(sum<q.price){status.textContent='💡 돈이 조금 부족해요. 동전을 더 넣어 볼까요?';return}
  win();
}
function win(){locked=true;cleanupDrag();sound();sparks();const status=document.getElementById('status');if(status)status.textContent='🎉 참 잘했어요! 물건을 샀어요!';const actions=document.getElementById('actions');if(actions)actions.innerHTML=`<button class="buy" onclick="next()">${idx===2?'모두 완료!':'다음 문제 ➜'}</button>`}

function coinHTML(value,side='obverse',classes='coin'){
  const c=value===500?'c500':'c100';
  const src=value===500?(side==='reverse'?IMG500_FRONT:IMG500_BACK):(side==='reverse'?IMG100_FRONT:IMG100_BACK);
  return `<div class="${classes} ${c} ${side}" data-value="${value}"><img src="${src}" alt="${value}원 동전 ${side==='obverse'?'숫자면(앞면)':'그림면(뒷면)'}"></div>`;
}

function miniCoin(c,side){
  const cls=c.value===500?'c500':'c100';
  const src=c.value===500?(side==='reverse'?IMG500_FRONT:IMG500_BACK):(side==='reverse'?IMG100_FRONT:IMG100_BACK);
  return `<div class="miniCoin ${cls} ${side}" data-selected-id="${c.id}" data-value="${c.value}"><img src="${src}" alt="${c.value}원 동전"></div>`;
}

/* -------- 터치/마우스 공용 드래그 앤 드롭 -------- */
function beginDrag(e,value,origin='source',selectedId=null,side='obverse'){
  if(locked)return;
  e.preventDefault();
  const ghost=document.createElement('div');
  ghost.className='dragGhost '+(value===500?'c500':'c100')+' '+side;
  const src=value===500?(side==='reverse'?IMG500_FRONT:IMG500_BACK):(side==='reverse'?IMG100_FRONT:IMG100_BACK);
  ghost.innerHTML=`<img src="${src}" alt="${value}원 동전">`;
  document.body.appendChild(ghost);
  dragState={value,ghost,pointerId:e.pointerId,origin,selectedId,side};
  moveGhost(e.clientX,e.clientY);document.body.style.touchAction='none';
  window.addEventListener('pointermove',onDragMove,{passive:false});window.addEventListener('pointerup',onDragEnd,{passive:false});window.addEventListener('pointercancel',onDragCancel,{passive:false});highlightTarget(e.clientX,e.clientY);
}
function moveGhost(x,y){if(!dragState)return;dragState.ghost.style.left=x+'px';dragState.ghost.style.top=y+'px'}
function onDragMove(e){if(!dragState)return;e.preventDefault();moveGhost(e.clientX,e.clientY);highlightTarget(e.clientX,e.clientY)}
function highlightTarget(x,y){document.querySelectorAll('.dropZone,.returnZone').forEach(z=>z.classList.remove('active'));const el=document.elementFromPoint(x,y);const zone=el&&el.closest?el.closest('.dropZone,.returnZone'):null;if(zone)zone.classList.add('active')}
function onDragEnd(e){
  if(!dragState)return;e.preventDefault();
  const el=document.elementFromPoint(e.clientX,e.clientY);const zone=el&&el.closest?el.closest('.dropZone,.returnZone'):null;
  const state={...dragState};cleanupDrag();if(!zone)return;
  if(mode==='C'&&zone.id==='itemDrop'){win();return}
  if(mode!=='C'&&state.origin==='source'&&zone.id==='paymentZone'){
    selectedCoins.push({id:++coinSeq,value:state.value});render();return;
  }
  if(mode!=='C'&&state.origin==='payment'&&zone.id==='returnZone'){
    selectedCoins=selectedCoins.filter(c=>c.id!==state.selectedId);render();return;
  }
}
function onDragCancel(){cleanupDrag()}
function cleanupDrag(){document.querySelectorAll('.dropZone,.returnZone').forEach(z=>z.classList.remove('active'));if(dragState&&dragState.ghost&&dragState.ghost.remove)dragState.ghost.remove();dragState=null;document.body.style.touchAction='';window.removeEventListener('pointermove',onDragMove);window.removeEventListener('pointerup',onDragEnd);window.removeEventListener('pointercancel',onDragCancel)}
function bindDragCoins(side='obverse'){
  document.querySelectorAll('.coin[data-value]').forEach(el=>el.addEventListener('pointerdown',e=>beginDrag(e,Number(el.dataset.value),'source',null,side)));
  document.querySelectorAll('.miniCoin[data-selected-id]').forEach(el=>el.addEventListener('pointerdown',e=>beginDrag(e,Number(el.dataset.value),'payment',Number(el.dataset.selectedId),side)));
}

function render(){
  if(!mode){app.innerHTML=`<h2>어떤 친구가 도전할까요?</h2><div class="panel"><button class="choice" onclick="start('A')">🌟 지오<br><small>가격 만들기</small></button><button class="choice" onclick="start('B')">🌈 하리<br><small>알맞은 동전 찾기</small></button><button class="choice" onclick="start('C')">🐰 하준<br><small>동전 주기</small></button></div><p class="muted">친구를 선택하면 각자 3개의 미션을 시작해요.</p>`;return}
  if(idx>=3){app.innerHTML=`<div class="panel"><div class="item">🏆</div><h2>${names[mode]}, 미션 성공!</h2><p class="big">정말 잘했어요!</p><button onclick="home()">다른 친구 도전하기</button><button onclick="start('${mode}')">다시 하기</button></div>`;return}
  const q=data[mode][idx];
  if(mode==='C'){
    app.innerHTML=`<div class="bar"><div class="fill" style="width:${idx/3*100}%"></div></div><p class="muted">${names[mode]} · ${idx+1} / 3 미션 · ${labels[mode]}</p><div class="panel"><h2>동전을 물건 위로 끌어다 놓아 보세요!</h2><div class="dragGuide">👇 동전을 잡고 → 물건으로 이동해요</div><div id="returnZone" class="returnZone"><div class="returnTitle">🪙 동전 보관함</div><div class="coinTray"><div class="coinSource">${coinHTML(100,'reverse')}<div class="dragLabel">동전</div></div></div></div><div id="itemDrop" class="dropZone itemDrop"><div class="dropTitle">여기에 동전을 놓아요</div><div class="item">${q.item}</div><div class="big">${q.name}</div></div></div><div id="actions"></div><p id="status" class="status"></p><div class="footer"><button onclick="home()">⌂ 친구 선택</button><button onclick="start('${mode}')">↻ 처음부터</button></div>`;
    bindDragCoins('reverse');return;
  }

  const side=mode==='B'?'obverse':(q.side||'obverse');
  app.innerHTML=`
    <div class="bar"><div class="fill" style="width:${idx/3*100}%"></div></div>
    <p class="muted">${names[mode]} · ${idx+1} / 3 미션 · ${labels[mode]}</p>
    <div class="panel">
      <h2>${q.prompt}</h2>
      ${q.reverseProblem?'<div class="reverseNotice">🔄 이번 문제는 동전의 그림면(뒷면)만 보여요.</div>':''}
      <div class="item">${q.item}</div><div class="big">${q.name} ${q.price}원</div>
      <div class="dragGuide">👇 필요한 동전을 결제칸으로 끌어다 놓아요</div>
      <div id="returnZone" class="returnZone">
        <div class="returnTitle">🪙 동전 보관함 <small>— 넣은 동전도 여기로 다시 끌어오면 빠져요</small></div>
        <div class="coinTray">
          <div class="coinSource">${coinHTML(100,side)}<div class="dragLabel">100원</div></div>
          <div class="coinSource">${coinHTML(500,side)}<div class="dragLabel">500원</div></div>
        </div>
      </div>
      <div id="paymentZone" class="dropZone">
        <div class="dropTitle">🛒 결제칸</div>
        <div class="selectedCoins">${selectedCoins.length?selectedCoins.map(c=>miniCoin(c,side)).join(''):'<span class="emptyText">동전을 여기에 놓아 보세요.</span>'}</div>
        <div class="big">합계 ${total()}원</div>
      </div>
      ${selectedCoins.length?'<div class="hint">↩ 잘못 넣었나요? 결제칸의 동전을 잡아 위의 동전 보관함으로 옮겨 보세요.</div>':''}
    </div>
    <div id="actions"><button class="buy" onclick="checkPurchase()">🛒 구매하기</button><button class="reset" onclick="resetCoins()">↻ 모두 다시 넣기</button></div>
    <p id="status" class="status"></p>
    <div class="footer"><button onclick="home()">⌂ 친구 선택</button><button onclick="start('${mode}')">↻ 처음부터</button></div>`;
  bindDragCoins(side);
}
render();
</script>
</body>
</html>
